workflows:
  ios-unsigned:
    name: SARAN FF Activation App
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Build iOS app
        script: |
          xcodebuild \
            -project SARANFFActivation.xcodeproj \
            -scheme SARANFFActivation \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        script: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/SARANFFActivation.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App bundle was not created."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/

          cd build/ipa
          zip -qry ../SARAN-FF-Activation-unsigned.ipa Payload

    artifacts:
      - build/*.ipa
