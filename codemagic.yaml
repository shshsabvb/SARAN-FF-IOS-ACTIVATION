workflows:
  saran-ff-activation-ipa:
    name: SARAN FF Activation IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build unsigned iOS app
        script: |
          xcodebuild -project SARANFFActivation.xcodeproj -scheme SARANFFActivation -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for ESign
        script: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/SARANFFActivation.app build/Payload/
          cd build
          zip -r ../SARAN-FF-Activation-unsigned.ipa Payload
    artifacts:
      - SARAN-FF-Activation-unsigned.ipa
